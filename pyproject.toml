[project]
name = "hellowork-jobs-mcp"
version = "1.0.0"
description = "MCP server for HelloWork Jobs search"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.6.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
    "python-dotenv>=1.0.0",
    "fake-useragent>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hellowork_jobs_mcp"]

[project.scripts]
hellowork-mcp = "hellowork_jobs_mcp.server:main"
